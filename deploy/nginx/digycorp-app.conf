# The application's location blocks, shared by the :80 and :443 server blocks.
#
# A SNIPPET RATHER THAN TWO COPIES, and the reason is the bug this replaces: a
# hand-maintained config drifted from the app and nobody noticed for ten days.
# Two server blocks with the routing pasted into both would drift from each
# OTHER, and the half that broke would be whichever half nobody curled.
#
# Included from deploy/nginx/digycorp-cx-agent.conf. Installed to
# /etc/nginx/snippets/digycorp-app.conf by scripts/remote-deploy.sh.
#
# Mirrors frontend/nginx.conf. The upstream is 127.0.0.1 here because the app
# runs as a systemd unit on this box, not as a compose service.

root /opt/digycorp-cx-agent/frontend/dist;
index index.html;

# SPA fallback — client-side routes resolve to index.html.
location / {
    try_files $uri $uri/ /index.html;
}

# Vehicle imagery (rule 18). The backend serves these from seed/media at /media,
# and the URLs come from tool output, so they are NOT part of the built SPA and
# try_files cannot resolve them. Without this block they hit the SPA fallback
# above and every vehicle card gets index.html where it expected a JPEG — a
# broken image, not a 404, which is markedly harder to recognise as routing.
location /media/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    # THE BACKEND OWNS THIS HEADER (main.py's _ImmutableStatic), which sends
    # `public, max-age=31536000, immutable`. `expires 1h` here REPLACED it —
    # nginx's expires directive overrides any upstream Cache-Control — so the
    # browser re-fetched every card image an hour after it last loaded one.
    #
    # THIS FILE IS THE VM's COPY, and that is the whole reason this needed a
    # second fix: the same block exists in frontend/nginx.conf for the docker
    # path, that one was corrected with the rest of the imagery change, and this
    # one was missed. The header was verified wrong in production
    # (`cache-control: max-age=3600` off the live host) after that deploy.
    # Photography is content-addressed by filename (seed/build_media.py), so a
    # new shoot is a new name and a year is honest. Nothing to set: passing the
    # upstream header through is correct.
}

# The voice-call WebSocket. Longest-prefix match takes this over the general
# /api/ block, and the Upgrade/Connection pair is what that block deliberately
# clears — without this the handshake dies at the proxy with a 400.
location /api/call/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    # A call is a LONG-lived socket with real silences; the read timeout must
    # comfortably exceed every server-side timer so the APP hangs up, never
    # the proxy.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}

# The human-takeover WebSocket — same treatment for the same reason. Minutes of
# legitimate silence while somebody types must not be the proxy's reason to
# hang up.
location /api/takeover/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}

# API proxy.
#
# NO TRAILING SLASH ON proxy_pass, and this is the whole bug that was here: with
# one, nginx rewrites the matched /api/ away and the app — whose routers are
# mounted AT /api/... — 404s every request. Verified on the box:
#     direct  :8000  /api/conversation/x -> 200
#     nginx     :80  /api/conversation/x -> 404
location /api/ {
    proxy_pass http://127.0.0.1:8000;

    # Voice-note uploads carry an audio blob. nginx defaults to 1 MB and
    # rejects anything larger with its OWN 413 before the request reaches the
    # backend, so the app's validation never runs and the customer sees a dead
    # mic rather than a real error. Matched to VOICE_MAX_BYTES (8 MB) so the
    # BACKEND owns the limit and this proxy is never the tighter, silent one.
    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";          # clear close/keep-alive for streaming
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;                     # SSE: token streaming stalls without this
    proxy_cache off;
    proxy_read_timeout 300s;                 # long agent/tool loops must not time out
}

# Health at the bare root, for scripts/remote-deploy.sh and deploy.yml. The app
# serves /health, /api/health and / — see backend/app/main.py::health_root.
location = /health {
    proxy_pass http://127.0.0.1:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
