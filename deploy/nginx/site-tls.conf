# The HTTPS server block, installed ONLY when a certificate exists.
#
# SEPARATE FILE ON PURPOSE. nginx refuses to start at all if `ssl_certificate`
# points at a file that is not there, so a single config carrying this block
# would make a freshly provisioned VM unbootable until certbot had run — and
# certbot's HTTP-01 challenge needs nginx already serving port 80. Splitting it
# breaks that circle: HTTP comes up first, the certificate is obtained through
# it, and scripts/remote-deploy.sh adds this file on the next deploy.
#
# Certificate: Let's Encrypt via `certbot certonly --webroot`, so certbot never
# edits nginx and these files stay the only description of the server. Renewal
# is certbot's own systemd timer and needs only the acme-challenge location in
# site-http.conf staying on plain HTTP.

server {
    # `listen ... ssl http2` IS THE OLD SPELLING, and it is the right one here:
    # this box is nginx 1.18 (jammy), where the newer `http2 on;` directive does
    # not exist and nginx refuses the whole config with
    # `unknown directive "http2"`. Swap to `http2 on;` only when the server
    # moves to nginx >= 1.25 — 24.04 would.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # BOTH NAMES ON ONE CERTIFICATE. elite-group.digycorp.com is the Cloudflare
    # DNS name for this box, and it is grey-cloud (DNS-only) — Cloudflare does
    # not terminate TLS, so the browser sees THIS certificate. Before it was on
    # the certificate the browser refused the site outright with
    # ERR_CERT_COMMON_NAME_INVALID while curl -k and every health gate stayed
    # green, because none of them check the name.
    #
    # Added to the EXISTING lineage on 2026-09-09 with
    # `certbot certonly --expand --cert-name digycorp-cx-test...`, deliberately
    # not as a second certificate: a new lineage means a new live/ directory,
    # and CERT_DIR in scripts/remote-deploy.sh guards the install of this very
    # file on that path. That guard has already taken the site off HTTPS once
    # (DEPLOYMENT.md §5), so the paths below stay exactly as they were.
    server_name digycorp-cx-test.uaenorth.cloudapp.azure.com
                elite-group.digycorp.com;

    ssl_certificate     /etc/letsencrypt/live/digycorp-cx-test.uaenorth.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digycorp-cx-test.uaenorth.cloudapp.azure.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # NO HSTS YET, deliberately. HSTS is remembered by the browser for its
    # max-age and cannot be withdrawn by turning it off here — if this host ever
    # needs to answer on plain HTTP again, every browser that saw the header
    # will refuse. Add it once TLS has proven itself here and the deploy gates
    # follow redirects.

    include /etc/nginx/snippets/digycorp-app.conf;
}
