# nginx for the VM deploy (2026-08-31).
#
# WHY THIS FILE EXISTS. The VM's nginx config was hand-written at provisioning
# in August and never version-controlled, so it drifted from the application the
# moment `app/` was ported over the scaffold. `frontend/nginx.conf` — the docker
# path — was correct the whole time and nobody could see the difference, which
# is the exact failure its own comment predicts: "the call button fails ONLY in
# the docker path, the worst kind of difference." It was the other way round.
#
# What the hand-written config got wrong, all found on 2026-08-31 by curling the
# box after the first successful deploy:
#
#   proxy_pass http://127.0.0.1:8000/;   <- THE TRAILING SLASH. It rewrites the
#     matched prefix away, so /api/conversation/x reached the app as
#     /conversation/x and EVERY API ROUTE 404ed. It looked fine only because
#     /api/health strips to /health, which the app also serves.
#   no proxy_buffering off               <- SSE token streaming stalls (AD-B/AD-D)
#   no /media/ block                     <- vehicle images fall through to the
#                                           SPA and render as broken images
#   no /api/call/ block                  <- the voice WebSocket dies at the proxy
#   no /api/takeover/ block              <- so does human takeover
#   no client_max_body_size              <- nginx's own 1 MB 413 rejects voice
#                                           notes before the app can validate
#
# KEEP THIS IN STEP WITH frontend/nginx.conf. They are the same application
# behind two different front doors; the only differences should be the upstream
# (127.0.0.1 here, the compose service name there), the document root, and TLS.

# ---------------------------------------------------------------------------- #
# HTTP :80
#
# NOT redirected to HTTPS, deliberately. Both deploy gates check for a literal
# 200 without following redirects — scripts/remote-deploy.sh uses `curl -sf`
# and deploy.yml compares %{http_code} to 200 — so a 301 here fails the deploy
# on a healthy server. Turn the redirect on only together with a `-L` in both.
# ---------------------------------------------------------------------------- #
server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt's HTTP-01 challenge. Must stay reachable over plain HTTP
    # forever: this is how the certificate RENEWS, and a redirect or an SPA
    # fallback swallowing it is the usual reason renewal silently stops working.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    include /etc/nginx/snippets/digycorp-app.conf;
}

# ---------------------------------------------------------------------------- #
# HTTPS :443 — added by certbot's managed block in the site file it writes.
# The application locations live in the snippet included above and below, so
# HTTP and HTTPS can never drift apart.
#
# TLS IS NOT A NICETY HERE. Three browser APIs this app uses are
# SECURE-CONTEXT-ONLY, and over plain HTTP:
#   crypto.randomUUID  threw and left the page BLANK (now guarded in src/id.ts)
#   getUserMedia       voice is unavailable — handled, shown as `unsupported`
#   geolocation        nearest-showroom falls back — handled
# The first was fatal; the other two mean voice simply cannot work until this
# server block is live.
#
# The certificate is Let's Encrypt, obtained with `certonly --webroot` so that
# certbot never edits nginx and THIS FILE stays the only description of the
# server. Renewal is certbot's own systemd timer; it needs nothing from here
# beyond the acme-challenge location above staying on plain HTTP.
# ---------------------------------------------------------------------------- #
