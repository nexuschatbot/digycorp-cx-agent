# Frontend nginx config (AD-G). Serves the built SPA and proxies /api to the
# backend service on the compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vehicle imagery (rule 18). The backend serves these from seed/media at
    # /media, and the URLs come from the tool output, so they are NOT part of
    # the built SPA and cannot be resolved by try_files. Without this block they
    # fall through to the SPA fallback above and every vehicle card gets
    # index.html where it expected a JPEG — a broken image, not a 404, which is
    # markedly harder to recognise as a routing problem.
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Images are immutable per deploy; let the browser keep them.
        proxy_cache off;
        expires 1h;
    }

    # The voice-call WebSocket (the ONLY WS in the system — AD-C amendment).
    # Longest-prefix match takes this over the general /api/ block below, and
    # the Upgrade/Connection pair is what the general block deliberately
    # clears — without this block the handshake dies at the proxy with a 400
    # and the call button fails ONLY in the docker path, the worst kind of
    # difference. Note getUserMedia additionally requires the PUBLIC origin to
    # be https, so in any real deployment this rides behind TLS as wss://.
    location /api/call/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # A call is a LONG-lived socket with real silences (CALL_SILENCE_
        # HANGUP_SECONDS of quiet is legitimate); the read timeout must
        # comfortably exceed every server-side timer so the APP hangs up,
        # never the proxy.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # The human-takeover WebSocket (2026-08-31) — the second WS after the call
    # gateway, and it needs the same treatment for the same reason: the general
    # /api/ block clears the Upgrade/Connection pair, so without this block the
    # handshake dies at the proxy only in the docker path. Long timeouts because
    # a takeover is a human conversation: minutes of legitimate silence while
    # somebody types or thinks must not be the proxy's reason to hang up.
    location /api/takeover/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # API proxy to the backend service. The SSE settings below are critical:
    # buffering MUST be off or token streaming (event: token) stalls (AD-B/AD-D).
    location /api/ {
        proxy_pass http://backend:8000;

        # Voice-note uploads (POST /api/voice/transcribe) carry an audio blob.
        # nginx defaults to 1 MB and rejects anything larger with its OWN 413
        # before the request ever reaches the backend — so the app's validation
        # never runs and the customer sees a dead mic rather than a real error.
        # Matched to VOICE_MAX_BYTES (8 MB) so the BACKEND owns the limit and
        # this proxy is never the tighter, silent one.
        client_max_body_size 8m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";          # clear "close"/"keep-alive" for streaming
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;                     # stream chunks straight through
        proxy_cache off;
        proxy_read_timeout 300s;                 # long agent/tool loops must not time out
    }
}
