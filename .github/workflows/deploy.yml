name: Deploy

# Merging into a long-lived branch deploys it. There is no manual approval gate
# between merge and production, by design — the gate is the pull request review
# on the production branch itself.
on:
  push:
    branches: [test, elite-prod, general-prod]

# Never let two deploys to the same VM overlap.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # lfs: true, AND THIS ONE MATTERS MORE THAN CI'S. The rsync below ships
      # backend/ wholesale to the VM, and all twelve LFS files live under it.
      # Without this the deploy would copy a 134-byte pointer over the 118 MB
      # embedding model and over all ten brochure PDFs — retrieval dead and
      # every brochure corrupt ON THE SERVER, with a green deploy and nothing
      # in the log to say so.
      #
      # It has never actually happened, only because no deploy has ever reached
      # the rsync: the health gate failed first (see scripts/remote-deploy.sh),
      # and before that the VM was unreachable.
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Maps the branch to its VM. Each target reads a distinct set of
      # repository secrets, so a misconfigured secret cannot cross environments.
      - name: Resolve deployment target
        id: target
        run: |
          case "${GITHUB_REF_NAME}" in
            test)         echo "prefix=TEST"         >> "$GITHUB_OUTPUT"
                          echo "name=test"           >> "$GITHUB_OUTPUT" ;;
            elite-prod)   echo "prefix=ELITE_PROD"   >> "$GITHUB_OUTPUT"
                          echo "name=elite-prod"     >> "$GITHUB_OUTPUT" ;;
            general-prod) echo "prefix=GENERAL_PROD" >> "$GITHUB_OUTPUT"
                          echo "name=general-prod"   >> "$GITHUB_OUTPUT" ;;
            *)            echo "::error::Branch ${GITHUB_REF_NAME} has no deployment target."
                          exit 1 ;;
          esac

      - name: Load target configuration
        id: cfg
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          prefix="${{ steps.target.outputs.prefix }}"
          host=$(echo "$SECRETS"    | jq -r --arg k "${prefix}_HOST"        '.[$k] // ""')
          user=$(echo "$SECRETS"    | jq -r --arg k "${prefix}_SSH_USER"    '.[$k] // ""')
          key=$(echo "$SECRETS"     | jq -r --arg k "${prefix}_SSH_KEY"     '.[$k] // ""')
          path=$(echo "$SECRETS"    | jq -r --arg k "${prefix}_DEPLOY_PATH" '.[$k] // ""')
          healthurl=$(echo "$SECRETS" | jq -r --arg k "${prefix}_HEALTH_URL" '.[$k] // ""')

          missing=""
          [ -z "$host" ] && missing="$missing ${prefix}_HOST"
          [ -z "$user" ] && missing="$missing ${prefix}_SSH_USER"
          [ -z "$key" ]  && missing="$missing ${prefix}_SSH_KEY"
          [ -z "$path" ] && missing="$missing ${prefix}_DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

          echo "host=$host"           >> "$GITHUB_OUTPUT"
          echo "user=$user"           >> "$GITHUB_OUTPUT"
          echo "path=$path"           >> "$GITHUB_OUTPUT"
          echo "health_url=$healthurl" >> "$GITHUB_OUTPUT"
          echo "$key" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: /api
        run: |
          npm ci
          npm run build

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ steps.cfg.outputs.host }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync application to VM
        env:
          HOST: ${{ steps.cfg.outputs.host }}
          USER_NAME: ${{ steps.cfg.outputs.user }}
          DEPLOY_PATH: ${{ steps.cfg.outputs.path }}
        run: |
          # --delete REMOVES ANYTHING AT THE DESTINATION THAT IS NOT AT THE
          # SOURCE, and the source is a git checkout — so every gitignored file
          # the server owns is deleted unless it is excluded here.
          #
          # .env holds the server's secrets (ANTHROPIC_API_KEY and the rest).
          # config.py calls load_dotenv() with no argument, which resolves from
          # the working directory, so it lives at $DEPLOY_PATH/backend/.env —
          # inside this target. Deleting it leaves a service that starts and
          # cannot answer.
          #
          # *.db is the database. DATABASE_URL defaults to
          # sqlite:///./elite_demo.db, again relative to backend/, and
          # agent_checkpoints.db beside it holds every live conversation.
          # Both are gitignored. Without these excludes a deploy silently
          # destroys the customer data it was meant to ship code for.
          #
          # This has not bitten yet only because the two deploys that ever
          # succeeded predate the port, when the scaffold owned neither file.
          rsync -az --delete \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude '.git' --exclude 'node_modules' --exclude '.venv' \
            --exclude 'frontend/node_modules' \
            --exclude '.env' --exclude '.env.*' \
            --exclude '*.db' --exclude '*.db-shm' --exclude '*.db-wal' \
            backend/ "$USER_NAME@$HOST:$DEPLOY_PATH/backend/"

          rsync -az --delete \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=yes" \
            frontend/dist/ "$USER_NAME@$HOST:$DEPLOY_PATH/frontend/dist/"

          rsync -az \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=yes" \
            scripts/remote-deploy.sh "$USER_NAME@$HOST:$DEPLOY_PATH/remote-deploy.sh"

          # The nginx config. remote-deploy.sh installs it from here — it used
          # to be hand-written on the box and versioned nowhere, which is how it
          # drifted from the application without a single diff to show for it.
          # NO --delete: this directory is the source of truth for what it
          # installs, not for what else the box may keep alongside it.
          rsync -az \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=yes" \
            deploy/nginx/ "$USER_NAME@$HOST:$DEPLOY_PATH/deploy/nginx/"

      - name: Run remote deploy
        env:
          HOST: ${{ steps.cfg.outputs.host }}
          USER_NAME: ${{ steps.cfg.outputs.user }}
          DEPLOY_PATH: ${{ steps.cfg.outputs.path }}
          ENV_NAME: ${{ steps.target.outputs.name }}
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=yes "$USER_NAME@$HOST" \
            "chmod +x '$DEPLOY_PATH/remote-deploy.sh' && ENVIRONMENT='$ENV_NAME' '$DEPLOY_PATH/remote-deploy.sh' '$DEPLOY_PATH'"

      - name: Health check
        if: steps.cfg.outputs.health_url != ''
        env:
          HEALTH_URL: ${{ steps.cfg.outputs.health_url }}
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Health check passed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: got HTTP $code, retrying in 6s..."
            sleep 6
          done
          echo "::error::Health check never returned 200 at $HEALTH_URL after deploying to ${{ steps.target.outputs.name }}."
          exit 1

      - name: Remove deploy key
        if: always()
        run: rm -f /tmp/deploy_key
