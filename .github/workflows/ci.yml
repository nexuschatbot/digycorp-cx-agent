name: CI

# Runs on every pull request, and on pushes to the long-lived branches so the
# branch head always has a status of its own.
on:
  pull_request:
  push:
    branches: [test, elite-prod, general-prod]

# dorny/paths-filter lists a PR's changed files through the API, and the
# default workflow token cannot: every pull_request run died at the `changes`
# job with "Resource not accessible by integration" before a single test ran.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Detects which parts of the monorepo a change touches, so a frontend-only
  # PR does not pay for the backend job and vice versa.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # SHARDED ACROSS PARALLEL JOBS (2026-09-02). One job on four vCPUs ran the
    # suite in ~270s of test time; three jobs, each taking a balanced third via
    # pytest-split, run concurrently so the slowest finishes in ~90s. Each shard
    # still uses -n auto within itself, so the effective parallelism is 3 × 4.
    # The cost is 3× the runner minutes — a deliberate trade of money for the
    # sub-3-minute feedback loop this project asked for.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      # lfs: true IS LOAD-BEARING, not a nicety. Twelve files are in LFS and
      # every one is under backend/: the 118 MB int8 embedding model, its
      # tokenizer, and ten brochure PDFs. Without this, checkout writes ~134
      # byte pointer files in their place and three tests fail in ways that
      # look like application bugs — onnxruntime cannot load the "model" so
      # routing reports "no clear winner", and a brochure "PDF" starts with
      # `version https://git-lfs.github.com/spec/v1` instead of `%PDF-`.
      #
      # Only this job takes the cost. `changes` reads paths, not contents, and
      # nothing under frontend/ is in LFS.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # -n auto: one worker per vCPU (4 on ubuntu-latest). The suite is
      # parallel-safe — each worker is its own process with its own in-memory db.
      #
      # THREE THINGS COMPOSE HERE:
      #   --splits/--group  this job's balanced third of the suite (pytest-split,
      #                     using .test_durations so cost is even, not count)
      #   -n auto           four workers inside this shard, one per vCPU
      #   the embedding memo (tests/conftest.py::_memoise_embeddings) embeds the
      #                     228-chunk corpus once per worker instead of once per
      #                     retrieval test — the single biggest cut, ~180s → ~19s
      #                     for that file.
      # Measured 2026-09-02: the memo alone took the single-job test step from
      # 455s to 270s; sharding three ways brings the slowest shard to ~90s.
      - name: Test
        run: pytest -q -n auto --splits 3 --group ${{ matrix.shard }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Single required status check. Passes when every job that actually ran
  # succeeded, including the case where a job was skipped by path filtering.
  ci-passed:
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs did not succeed."
          exit 1
      - run: echo "CI passed."
