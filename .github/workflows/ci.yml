name: CI

# Runs on every pull request, and on pushes to the long-lived branches so the
# branch head always has a status of its own.
on:
  pull_request:
  push:
    branches: [test, elite-prod, general-prod]

# dorny/paths-filter lists a PR's changed files through the API, and the
# default workflow token cannot: every pull_request run died at the `changes`
# job with "Resource not accessible by integration" before a single test ran.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Detects which parts of the monorepo a change touches, so a frontend-only
  # PR does not pay for the backend job and vice versa.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # lfs: true IS LOAD-BEARING, not a nicety. Twelve files are in LFS and
      # every one is under backend/: the 118 MB int8 embedding model, its
      # tokenizer, and ten brochure PDFs. Without this, checkout writes ~134
      # byte pointer files in their place and three tests fail in ways that
      # look like application bugs — onnxruntime cannot load the "model" so
      # routing reports "no clear winner", and a brochure "PDF" starts with
      # `version https://git-lfs.github.com/spec/v1` instead of `%PDF-`.
      #
      # Only this job takes the cost. `changes` reads paths, not contents, and
      # nothing under frontend/ is in LFS.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # -n auto: one worker per vCPU (4 on ubuntu-latest). The suite is
      # parallel-safe — each worker is its own process with its own in-memory db.
      #
      # --dist loadscope KEEPS A MODULE ON ONE WORKER, and it is load-bearing for
      # the retrieval tests. Those re-embed the 228-chunk corpus, which a
      # session-scoped memo (tests/conftest.py::_memoise_embeddings) now computes
      # ONCE per worker — so clustering test_retrieval.py onto a single worker
      # pays that ~15-30s embed once for the whole file instead of once on each
      # worker the default `load` mode would scatter it across. Measured
      # 2026-09-02: the memo cut the full suite from 225s to 124s locally, and
      # loadscope took it to 104s; the retrieval file alone fell from ~180s to
      # ~19s serially (first test embeds, the rest hit the memo).
      - name: Test
        run: pytest -q -n auto --dist loadscope

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Single required status check. Passes when every job that actually ran
  # succeeded, including the case where a job was skipped by path filtering.
  ci-passed:
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs did not succeed."
          exit 1
      - run: echo "CI passed."
