[pytest]
pythonpath = .
testpaths = tests

# PARALLEL BY DEFAULT (2026-09-04). The suite has been parallel-safe since
# sharding shipped — every worker is its own process with its own in-memory
# database — but only CI passed `-n auto`, so a local `pytest -q` ran the whole
# thing on one core: 420s against 62s here. Nobody should have to remember a
# flag to get the same run CI gets.
#
# `auto` is one worker per logical CPU. Override for a single test or a
# debugger, where workers only get in the way:
#
#     pytest -p no:xdist tests/test_booking.py -k licence   # serial
#     pytest -n 0 tests/test_booking.py                     # also serial
#
# Two fixtures do the heavy lifting behind this number, both in
# tests/conftest.py and both documented there: the embedding cache (shared
# across workers on disk, because services/cache.py is Redis-only and this
# suite blocks sockets) and the slot-inventory template (generated once per
# worker, then copied). Without them `-n auto` alone is 188s, because eight
# workers rebuild the same corpus and the same inventory eight times.
addopts = -n auto
